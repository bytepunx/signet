name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  proto-check:
    name: Proto generated files
    runs-on: ubuntu-latest
    # Only this job needs write access, and only to push a regenerated-stubs
    # commit back onto a same-repo PR branch (see below) — every other job
    # keeps the default read-only token from the top-level permissions block.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Regenerate proto stubs
        run: buf generate

      - name: Check for drift
        id: diff
        run: |
          if git diff --quiet gen/; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      # buf.gen.yaml's schema input tracks bytepunx/signet-proto's main
      # branch (no tagged releases exist yet to pin to), so drift here
      # usually reflects a real upstream schema change landing between when
      # this PR branch was cut and when CI ran — not something the
      # contributor did wrong. Auto-commit the fix onto the PR branch rather
      # than just failing, so the contributor doesn't need a manual
      # `buf generate` + commit round trip. Only possible for a same-repo PR
      # branch: GITHUB_TOKEN is read-only against a fork's branch regardless
      # of the permissions above, so fork PRs fall through to the failure
      # step below with the diff and instructions instead.
      - name: Auto-commit regenerated stubs to the PR branch
        if: steps.diff.outputs.dirty == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gen/
          git commit -m "chore(proto): regenerate stubs (buf generate)"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Fail if gen/ is still out of sync
        if: steps.diff.outputs.dirty == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "::error::gen/ is out of sync with proto sources. Run 'buf generate' and commit the result."
          git diff gen/
          exit 1

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint deploy/helm/signet \
            --set signet.trustDomain=example.org \
            --set signet.existingSecret=signet-secrets

      - name: Validate chart schema
        run: |
          helm template signet deploy/helm/signet \
            --set signet.trustDomain=example.org \
            --set signet.existingSecret=signet-secrets \
            > /dev/null

      - name: admin.clusterAccess=false (default) omits admin Service/NetworkPolicy resources
        run: |
          OUT=$(helm template signet deploy/helm/signet \
            --set signet.trustDomain=example.org \
            --set signet.existingSecret=signet-secrets)
          echo "$OUT" | grep -q '"127.0.0.1:8444"' || { echo "::error::expected loopback-only SIGNET_ADMIN_ADDR by default"; exit 1; }
          if echo "$OUT" | grep -q 'name: admin'; then
            echo "::error::did not expect an admin-named port when clusterAccess is disabled"
            exit 1
          fi

      - name: admin.clusterAccess=true adds admin Service port and NetworkPolicy rule
        run: |
          OUT=$(helm template signet deploy/helm/signet \
            --set signet.trustDomain=example.org \
            --set signet.existingSecret=signet-secrets \
            --set admin.clusterAccess=true \
            --set admin.tls.acknowledgeInsecure=true)
          echo "$OUT" | grep -q '"0.0.0.0:8444"' || { echo "::error::expected SIGNET_ADMIN_ADDR to be rebound off loopback"; exit 1; }
          echo "$OUT" | grep -q 'name: admin' || { echo "::error::expected an admin-named port in the rendered manifests"; exit 1; }

      - name: admin.clusterAccess=true without admin.tls fails to render
        run: |
          if helm template signet deploy/helm/signet \
            --set signet.trustDomain=example.org \
            --set signet.existingSecret=signet-secrets \
            --set admin.clusterAccess=true > /dev/null 2>&1; then
            echo "::error::expected render to fail: clusterAccess without tls.enabled or acknowledgeInsecure"
            exit 1
          fi

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build signetd image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: signetd
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build signet CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: signet
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

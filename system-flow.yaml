version: 1
name: "signet"
key: "s"
description: "SPIFFE-based configuration and secrets distribution for Kubernetes"
owner: "alex"
repo: "https://github.com/bytepunx/signet"
template:
  repo: "https://github.com/bytepunx/system-flow-template"
  ref: "v1.0.115"
  version: "1.0.115"
  applied: 2026-10-24T22:48:55Z
layout:
  design: design
  docs: docs
  wip: wip
projects:
  - name: server
    path: server
    kind: go
  - name: proto
    path: proto
    kind: buf
  - name: admin
    path: admin
    kind: sveltekit
  - name: client-csharp
    path: client-csharp
    kind: csharp
  - name: client-erlang
    path: client-erlang
    kind: erlang
  - name: client-go
    path: client-go
    kind: go
  - name: client-python
    path: client-python
    kind: python
  - name: client-rust
    path: client-rust
    kind: rust
  - name: client-typescript
    path: client-typescript
    kind: node
dashboard:
  image: ghcr.io/bytepunx/flaiover
  tag: latest
  port: 4242
  bind: 0.0.0.0 # 127.0.0.1 to keep the dashboard on this host only
planning:
  agent:
    harness: claude-code
    model: claude-fable-5-1
    config:
      effort: medium
  hour_rate: 150
agent:
  harness: claude-code
  model: claude-opus-5-5
  config:
    effort: high

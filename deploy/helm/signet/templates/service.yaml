apiVersion: v1
kind: Service
metadata:
  name: {{ include "signet.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "signet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "signet.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
    {{- if .Values.signet.webhookAddr }}
    - name: webhook
      port: 8445
      targetPort: webhook
      protocol: TCP
    {{- end }}
    {{- if .Values.admin.clusterAccess }}
    - name: admin
      port: 8444
      targetPort: admin
      protocol: TCP
    {{- end }}
# Note: by default the admin port (8444) is NOT exposed here. It is bound to
# 127.0.0.1 inside the container, and operators access it exclusively via:
#   kubectl port-forward -n <namespace> svc/signet 8444:8444
#
# Set admin.clusterAccess: true (values.yaml) to also expose it in-cluster
# for automated callers that cannot port-forward -- this atomically rebinds
# the listener off loopback, adds the "admin" port above, and opens the
# matching NetworkPolicy ingress rule. Once exposed this way, the bearer
# token required on every admin RPC crosses the pod network, so also set
# admin.tls.enabled: true (see bytepunx/signet#24) -- otherwise that token
# travels in cleartext to anything with pod-network visibility.

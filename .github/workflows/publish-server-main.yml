name: Publish server main

# Publishes the `main` image tag of signetd to ghcr.io and Docker Hub when a
# push to main changes the server. Tagged releases use release-server.yml,
# which also sets the version and latest tags. The `main` tag is for dev
# clusters.

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/publish-server-main.yml"

permissions:
  contents: read
  packages: write   # push to ghcr.io

jobs:
  push-image:
    name: Push signetd image (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push signetd
        uses: docker/build-push-action@v6
        with:
          context: server
          target: signetd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/signetd:main
            docker.io/bytepunx/signet:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

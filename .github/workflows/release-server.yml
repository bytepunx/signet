name: Release server

# A push of server/vX.Y.Z tests the server, then publishes the CLI binaries,
# the signetd images, the Helm chart, and a GitHub Release. A pre-release tag
# (server/vX.Y.Z-suffix) pushes only the exact version image tag, never latest
# or vX.Y, and makes a pre-release.

on:
  push:
    tags:
      - "server/v*"

permissions:
  contents: write       # create GitHub releases and upload assets
  packages: write       # push to ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Version facts every other job reads
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}           # vX.Y.Z[-suffix]
      version: ${{ steps.v.outputs.version }}   # X.Y.Z[-suffix]
      minor: ${{ steps.v.outputs.minor }}       # vX.Y
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME#server/}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag ${GITHUB_REF_NAME} is not server/vX.Y.Z[-suffix]" >&2
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The same script a developer runs locally
  # ---------------------------------------------------------------------------
  test:
    name: Test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/test-server.sh
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build CLI binaries for all target platforms
  # ---------------------------------------------------------------------------
  build-cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build
        working-directory: server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          BINARY="signet-${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${TAG}" \
            -o "dist/${BINARY}" \
            ./cmd/signet
          (cd dist && sha256sum "${BINARY}" > "${BINARY}.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build and push signetd image
  # ---------------------------------------------------------------------------
  build-image:
    name: Build and push signetd image
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/signetd
            docker.io/bytepunx/signet
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: Build and push signetd
        uses: docker/build-push-action@v6
        with:
          context: server
          target: signetd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # ---------------------------------------------------------------------------
  # Package and publish Helm chart as OCI artifact
  # ---------------------------------------------------------------------------
  publish-chart:
    name: Publish Helm chart
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package and push chart
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          helm package server/deploy/helm/signet \
            --version "${VERSION}" \
            --app-version "${TAG}" \
            --destination dist/
          helm push "dist/signet-${VERSION}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

  # ---------------------------------------------------------------------------
  # Create GitHub release and attach all assets
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub release
    needs: [version, build-cli, build-image, publish-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for the notes

      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/
          merge-multiple: true

      - name: Consolidate checksums
        working-directory: dist
        run: |
          cat signet-*.sha256 | sort -k2 > sha256sums.txt
          rm signet-*.sha256

      - name: Generate release notes
        run: |
          # The tag annotation, then the commits since the previous server/ tag.
          # checkout may leave an annotated tag as a lightweight ref, so fetch it.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo
            echo "## Changes"
          } > release_notes.md
          PREV_TAG=$(git tag -l 'server/v*' --sort=-v:refname | grep -vxF "${GITHUB_REF_NAME}" | grep -v -- '-' | head -n1 || true)
          if [[ -n "$PREV_TAG" ]]; then
            git log --oneline "${PREV_TAG}..${GITHUB_REF_NAME}" -- server >> release_notes.md
          else
            git log --oneline "${GITHUB_REF_NAME}" -- server >> release_notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            dist/signet-*
            dist/sha256sums.txt

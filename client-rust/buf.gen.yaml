version: v2
plugins:
  # prost generates message types; tonic generates the async gRPC client/server code.
  # Plugin versions pinned to what src/gen was last generated and verified
  # against (bytepunx/signet-clients#64) — an unpinned `remote:` reference
  # floats on whatever the BSR currently serves as latest, so a plugin
  # release with a different generated-code shape could silently break every
  # future `buf generate` here. Bump deliberately, review the diff.
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: src/gen
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: src/gen
# The schema is the one in this repository, so a schema change and the code
# that uses it land in one pull request; there is no version to bump.
inputs:
  - directory: ../proto/proto
